[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained compile-time procedural macro from specta/tauri-specta, not a vulnerability; no safe update is available." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is an unmaintained compile-time dependency of Tauri's GTK3 bindings on Linux, not a vulnerability." },
]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS must use rustls to keep Windows and macOS builds reproducible." },
  { crate = "openssl-sys", reason = "TLS must use rustls to keep Windows and macOS builds reproducible." },
  { crate = "native-tls", reason = "TLS must use rustls to keep Windows and macOS builds reproducible." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      ts: ${{ steps.select.outputs.ts }}
      wasm: ${{ steps.select.outputs.wasm }}
      native: ${{ steps.select.outputs.native }}
      deny: ${{ steps.select.outputs.deny }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: select
        run: bun tools/ci/src/index.ts >> "$GITHUB_OUTPUT"

  rust:
    name: ${{ matrix.os == 'ubuntu-latest' && 'rust (cargo test)' || format('rust (cargo test) [{0}]', matrix.os) }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude specialist-native --locked

  ts:
    name: ${{ matrix.os == 'ubuntu-latest' && 'ts (typecheck)' || format('ts (typecheck) [{0}]', matrix.os) }}
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  wasm:
    name: wasm (build and test)
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - id: wbg
        run: echo "version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - run: cargo check -p specialist-core --target wasm32-unknown-unknown --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run boundaries
      - run: bun run check:wasm
      - run: bun run test:wasm
      - run: bun run build:web
      - run: bun run --filter @specialist/e2e test:e2e
        env:
          E2E_REQUIRE_BROWSER: "1"

  native:
    name: ${{ matrix.os == 'ubuntu-latest' && 'native (desktop build)' || format('native (desktop build) [{0}]', matrix.os) }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -a tools/system-deps/debian.txt sudo apt-get install -y --no-install-recommends
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cargo test -p specialist-native --locked
      - run: bun run build:native -- --no-bundle

  deny:
    name: deny (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  ci:
    name: ci
    if: always()
    needs: [changes, rust, ts, wasm, native, deny]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "unexpected job result: $result"; exit 1 ;;
            esac
          done
